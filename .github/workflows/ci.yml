name: Test Deno on windows-arm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-deno-windows-arm:
    runs-on: windows-11-arm
    name: Test Deno on Windows 11 ARM
    steps:
      - uses: actions/checkout@v5

      - name: Download Deno Windows x64 binary
        run: |
          $denoVersion = "v2.5.6"
          $downloadUrl = "https://github.com/denoland/deno/releases/download/$denoVersion/deno-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $downloadUrl -OutFile deno.zip
          Expand-Archive -Path deno.zip -DestinationPath .
          Remove-Item deno.zip

      - name: Verify Deno installation
        run: .\deno --version

      - name: Run deno task
        run: .\deno task
