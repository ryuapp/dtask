[package]
name = "dtask"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dtask"
path = "main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
deno_task_shell = "0.26.1"
tokio = { version = "1.48.0", features = ["rt"] }
deno_config = "0.71.0"
colored = "2.2.0"
indexmap = { version = "2.12.0", features = ["serde"] }
url = "2.5.7"

[profile.release]
opt-level = 1
lto = false
