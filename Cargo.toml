[package]
name = "dtask"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dtask"
path = "main.rs"

[dependencies]
serde_json = "1.0.145"
clap = { version = "4.5.51", features = ["derive"] }
deno_task_shell = "0.26.1"
tokio = { version = "1.48.0", features = ["rt"] }
jsonc-parser = { version = "0.27.0", features = ["serde"] }
